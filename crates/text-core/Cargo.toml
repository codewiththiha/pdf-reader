[package]
name = "text-core"
version = "0.1.0"
edition = "2024"
description = "Pure text-document domain logic: the typography settings schema, block parsing (plain text and Markdown), page cutting, and in-document search. No wasm, no DOM, no leptos — unit-testable on the host."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
