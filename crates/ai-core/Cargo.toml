[package]
name = "ai-core"
version = "0.1.0"
edition = "2024"
description = "The format-agnostic core of the AI reading features: the word-explanation wire types, the gloss card's geometry and spring, the gloss mark and its anchor trait, the AI settings types, and the Tauri explain_word kickoff. No format-specific code — a new format plugs in its own anchor implementation."
license = "MIT"

[dependencies]
# The persisted gloss settings and the shared spring integrator both belong to
# the reader's core, and this crate is the one that borrows them. The
# dependency never runs the other way: `reader-core` does not know AI exists.
reader-core = { path = "../reader-core" }
serde = { version = "1", features = ["derive"] }
tauri-bridge = { path = "../tauri-bridge" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
